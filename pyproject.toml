[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-cruncher"
version = "1.6.1"
description = "Open-source high-performance integer multiplication & zero-storage Pi extraction (51-bit AVX-512 IFMA52 NTT + Crandall-Fagin Vedic Wave + Sparse NAF)"
readme = "README.md"
license = "MIT"
authors = [{name = "Santhosh Narayanan", email = "santhoshsathish94@gmail.com"}]
requires-python = ">=3.9"
keywords = ["bigint", "multiplication", "ntt", "fft", "avx512", "vedic-math", "high-performance", "number-theory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["xcruncher"]
include-package-data = true

[tool.setuptools.package-data]
xcruncher = ["*.so", "*.dll", "*.dylib", "_csrc/*.c", "_csrc/*.h"]
