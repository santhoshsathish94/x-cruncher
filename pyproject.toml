[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "x-cruncher"
version = "1.2.0"
description = "y-cruncher-tier arbitrary-precision integer multiplication engine (16-bit Crandall-Fagin Vedic Wave + WaveTrunks + Sparse NAF)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Santhosh Narayanan", email = "santhoshsathish94@gmail.com"}]
requires-python = ">=3.9"
keywords = ["bigint", "multiplication", "fft", "avx512", "vedic-math", "high-performance", "number-theory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["xcruncher"]
