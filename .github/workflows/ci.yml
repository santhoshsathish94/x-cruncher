name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Run C Exactness Suite
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run Python Bindings Suite
        run: python tests/test_python.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run AddressSanitizer + UndefinedBehaviorSanitizer (AVX-512 / AVX2 / Scalar)
        run: |
          gcc -O3 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fopenmp -Iinclude tests/test_xcruncher.c src/xcruncher.c -lm -o test_san
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 ./test_san
