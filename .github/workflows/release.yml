name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: x-cruncher-linux-x86_64
            ext: tar.gz
          - os: macos-latest
            artifact: x-cruncher-macos-arm64
            ext: tar.gz
          - os: windows-latest
            artifact: x-cruncher-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & Verify C + Python Suites
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
          python tests/test_python.py

      - name: Build & Verify Standalone Platform Wheel (Clean-Room Venv)
        shell: bash
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          python -m build --wheel --outdir .
          CLEAN_DIR="${RUNNER_TEMP}/xc_rel_wheel_check"
          rm -rf "${CLEAN_DIR}" && mkdir -p "${CLEAN_DIR}"
          python -m venv "${CLEAN_DIR}/venv"
          if [ -x "${CLEAN_DIR}/venv/bin/python" ]; then
            VP="${CLEAN_DIR}/venv/bin/python"
          else
            VP="${CLEAN_DIR}/venv/Scripts/python.exe"
          fi
          "${VP}" -m pip install ./*.whl
          cp tests/test_python.py "${CLEAN_DIR}/test_python.py"
          (cd "${CLEAN_DIR}" && "${VP}" test_python.py)

      - name: Stage Release Bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="${{ matrix.artifact }}-${TAG}"
          mkdir -p "${DIR}/include" "${DIR}/bin" "${DIR}/lib"
          cp include/xcruncher.h "${DIR}/include/"
          cp LICENSE README.md CHANGELOG.md CONTRIBUTING.md "${DIR}/"
          cp -r docs "${DIR}/docs"
          cp build/bench_xcruncher build/repro_raw_limbs build/test_xcruncher "${DIR}/bin/"
          cp build/libxcruncher* "${DIR}/lib/"
          tar -czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Stage Release Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = $env:GITHUB_REF_NAME
          $Dir = "${{ matrix.artifact }}-$Tag"
          New-Item -ItemType Directory -Force -Path "$Dir/include", "$Dir/bin", "$Dir/lib" | Out-Null
          Copy-Item include/xcruncher.h "$Dir/include/"
          Copy-Item LICENSE, README.md, CHANGELOG.md, CONTRIBUTING.md "$Dir/"
          Copy-Item -Recurse docs "$Dir/docs"
          Get-ChildItem build -Recurse -Include *.exe, *.dll | Copy-Item -Destination "$Dir/bin/"
          Get-ChildItem build -Recurse -Include *.lib, *.a | Copy-Item -Destination "$Dir/lib/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Dir" -DestinationPath "$Dir.zip"
          $Hash = (Get-FileHash "$Dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Dir.zip" | Out-File -Encoding ascii "$Dir.zip.sha256"

      - name: Upload Native Bundle & Platform Wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.whl

  package-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & Verify Python Source Distribution in Clean-Room Venv
        run: |
          python -m pip install --upgrade pip build wheel setuptools
          python -m build --sdist --outdir dist
          CLEAN_DIR="${RUNNER_TEMP}/xc_rel_sdist_check"
          rm -rf "${CLEAN_DIR}" && mkdir -p "${CLEAN_DIR}"
          python -m venv "${CLEAN_DIR}/venv"
          "${CLEAN_DIR}/venv/bin/python" -m pip install --upgrade pip wheel setuptools
          "${CLEAN_DIR}/venv/bin/python" -m pip install dist/*.tar.gz
          cp tests/test_python.py "${CLEAN_DIR}/test_python.py"
          (cd "${CLEAN_DIR}" && "${CLEAN_DIR}/venv/bin/python" test_python.py)
      - name: Upload Python Source Distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: dist/*.tar.gz

  publish-release:
    needs: [package-native, package-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Unified SHA256SUMS & Tag-Matched Release Notes
        shell: python
        run: |
          import hashlib, os, pathlib, re

          assets_dir = pathlib.Path("release-assets")
          sums = []
          for p in sorted(assets_dir.iterdir()):
              if p.is_file() and p.suffix in {".gz", ".zip", ".whl"}:
                  h = hashlib.sha256(p.read_bytes()).hexdigest()
                  sums.append(f"{h}  {p.name}")
          (assets_dir / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag.lstrip("v")
          cl = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)", cl, flags=re.M | re.S)
          changelog_sec = m.group(1).strip() if m else "See CHANGELOG.md for details."
          changelog_sec = changelog_sec.rstrip("-").strip()

          lines = [
              f"## x-cruncher {tag} — Open-source high-performance integer multiplication",
              "",
              f"`x-cruncher {tag}` is an MIT-licensed, zero-dependency C11 library and Python package for exact arbitrary-precision integer multiplication and zero-storage hexadecimal $\\pi$ digit extraction.",
              "",
              f"### Changes in {tag}",
              changelog_sec,
              "",
              "### Quick Reproducible Verification",
              "```bash",
              f"git clone --branch {tag} https://github.com/santhoshsathish94/x-cruncher.git",
              "cd x-cruncher",
              "make clean all && make test && make bench-100m && make repro",
              "```",
              "",
              f"See [`docs/BENCHMARKS.md`](https://github.com/santhoshsathish94/x-cruncher/blob/{tag}/docs/BENCHMARKS.md), [`docs/ARCHITECTURE.md`](https://github.com/santhoshsathish94/x-cruncher/blob/{tag}/docs/ARCHITECTURE.md), and [`README.md`](https://github.com/santhoshsathish94/x-cruncher/blob/{tag}/README.md) for full hardware configurations, `1T` / `4T` / `16C` results, concurrency guarantees, and `GNU GMP` / `y-cruncher` comparison methodology & limitations.",
          ]
          pathlib.Path("RELEASE_BODY.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "x-cruncher ${{ github.ref_name }} — Open-source high-performance integer multiplication"
          body_path: RELEASE_BODY.md
          files: release-assets/*
          generate_release_notes: false
