name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: x-cruncher-linux-x86_64
            ext: tar.gz
          - os: macos-latest
            artifact: x-cruncher-macos-arm64
            ext: tar.gz
          - os: windows-latest
            artifact: x-cruncher-windows-x86_64
            ext: zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build & Verify C + Python Suites
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure -C Release
          python tests/test_python.py

      - name: Stage Release Bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="${{ matrix.artifact }}-${TAG}"
          mkdir -p "${DIR}/include" "${DIR}/bin" "${DIR}/lib"
          cp include/xcruncher.h "${DIR}/include/"
          cp LICENSE README.md CHANGELOG.md CONTRIBUTING.md "${DIR}/"
          cp -r docs "${DIR}/docs"
          cp build/bench_xcruncher build/repro_raw_limbs build/test_xcruncher "${DIR}/bin/"
          cp build/libxcruncher* "${DIR}/lib/"
          tar -czf "${DIR}.tar.gz" "${DIR}"
          shasum -a 256 "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"

      - name: Stage Release Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = $env:GITHUB_REF_NAME
          $Dir = "${{ matrix.artifact }}-$Tag"
          New-Item -ItemType Directory -Force -Path "$Dir/include", "$Dir/bin", "$Dir/lib" | Out-Null
          Copy-Item include/xcruncher.h "$Dir/include/"
          Copy-Item LICENSE, README.md, CHANGELOG.md, CONTRIBUTING.md "$Dir/"
          Copy-Item -Recurse docs "$Dir/docs"
          Get-ChildItem build -Recurse -Include *.exe, *.dll | Copy-Item -Destination "$Dir/bin/"
          Get-ChildItem build -Recurse -Include *.lib, *.a | Copy-Item -Destination "$Dir/lib/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$Dir" -DestinationPath "$Dir.zip"
          $Hash = (Get-FileHash "$Dir.zip" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $Dir.zip" | Out-File -Encoding ascii "$Dir.zip.sha256"

      - name: Upload Native Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256

  package-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python Source Distribution & Wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          shasum -a 256 dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-release:
    needs: [package-native, package-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract Release Notes
        run: |
          cat > RELEASE_BODY.md << 'EOF'
          ## x-cruncher v1.6.0 — Open-source high-performance integer multiplication

          `x-cruncher v1.6.0` is an MIT-licensed, zero-dependency C11 library and Python package for exact arbitrary-precision integer multiplication and zero-storage hexadecimal $\pi$ digit extraction.

          ### Highlights
          - **Exact Integer Arithmetic:** Deterministic integer exactness across all input bit-patterns (verified bit-for-bit against `GNU GMP` and adversarial limb-saturation tests under `ASan + UBSan`).
          - **51-Bit Table-Free Lazy Harvey `[0, 2P)` NTT (`AVX-512 IFMA52 + VBMI`):** Uses two 51-bit primes (`2P < 2^52`) over signed `40-bit` Carry-Free Vedic *Vinculum* limbs `[-2^39, +2^39]` with 4-cursor fused Four-Step Radix-4 twiddles and signed `102-bit` Garner CRT.
          - **Reusable Plans, `WaveTrunk`, Squaring & Sparse `NAF`:** Pre-transformed constant operands (`xc_trunk_t`), automatic `A * A` squaring, and near-$2^k$ sparse fast-paths.
          - **Single-Binary Portability:** Runtime dispatch across `AVX-512 IFMA52`, `AVX-512`, `AVX2+FMA`, `ARM64 NEON`, and portable C11 scalar fallbacks on Linux, Windows, macOS, and Android.
          - **Reproducibility Suite:** Includes [`docs/BENCHMARKS.md`](https://github.com/santhoshsathish94/x-cruncher/blob/v1.6.0/docs/BENCHMARKS.md), [`docs/ARCHITECTURE.md`](https://github.com/santhoshsathish94/x-cruncher/blob/v1.6.0/docs/ARCHITECTURE.md), [`CONTRIBUTING.md`](https://github.com/santhoshsathish94/x-cruncher/blob/v1.6.0/CONTRIBUTING.md), and standalone raw-limb benchmark harness `bench/repro_raw_limbs.c` (`make repro`).

          ### Quick Reproducible Verification
          ```bash
          git clone --branch v1.6.0 https://github.com/santhoshsathish94/x-cruncher.git
          cd x-cruncher
          make clean all
          make test
          make bench-100m
          make repro
          ```

          See [`docs/BENCHMARKS.md`](https://github.com/santhoshsathish94/x-cruncher/blob/v1.6.0/docs/BENCHMARKS.md) and [`README.md#known-limitations-v160`](https://github.com/santhoshsathish94/x-cruncher/blob/v1.6.0/README.md#known-limitations-v160) for full hardware configurations, `1T` / `4T` / `16C` results, and `GNU GMP` / `y-cruncher` comparison methodology & limitations.
          EOF
          sed -i 's/^          //' RELEASE_BODY.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "x-cruncher ${{ github.ref_name }} — Open-source high-performance integer multiplication"
          body_path: RELEASE_BODY.md
          files: release-assets/*
          generate_release_notes: false
